name: Release App

on:
  push:
    tags:
      - "app-v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-app-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Validate app release tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify tag matches app version
        run: dart modules/app/tool/verify_release_tag.dart "${RELEASE_TAG}"
        env:
          RELEASE_TAG: ${{ github.ref_name }}

  quality:
    name: Analyze and test app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install app dependencies
        working-directory: modules/app
        run: flutter pub get

      - name: Flutter analyze
        working-directory: modules/app
        run: flutter analyze

      - name: Flutter test
        working-directory: modules/app
        run: flutter test

  build:
    name: Build app for ${{ matrix.platform.name }}
    needs:
      - validate-tag
      - quality
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux
            runner: ubuntu-latest
            target: linux
            slug: linux
            artifact_name: app-linux-assets
          - name: macOS
            runner: macos-latest
            target: macos
            slug: macos
            artifact_name: app-macos-assets
          - name: Windows
            runner: windows-latest
            target: windows
            slug: windows
            artifact_name: app-windows-assets

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux desktop dependencies
        if: matrix.platform.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libgtk-3-dev ninja-build pkg-config zip

      - name: Enable desktop target
        run: flutter config --enable-${{ matrix.platform.target }}-desktop

      - name: Install app dependencies
        working-directory: modules/app
        run: flutter pub get

      - name: Build release bundle
        working-directory: modules/app
        run: flutter build ${{ matrix.platform.target }} --release

      - name: Package Linux ZIP release asset
        if: matrix.platform.target == 'linux'
        run: |
          VERSION="${GITHUB_REF_NAME#app-v}"
          ARCH="$(uname -m)"
          FILE_NAME="$(dart modules/app/tool/release_asset_name.dart "${VERSION}" "${{ matrix.platform.slug }}" "${ARCH}" zip)"
          mkdir -p .artifacts/release-assets
          cd modules/app/build/linux/x64/release/bundle
          zip -r "${GITHUB_WORKSPACE}/.artifacts/release-assets/${FILE_NAME}" .

      - name: Package Linux TAR.GZ release asset
        if: matrix.platform.target == 'linux'
        run: |
          VERSION="${GITHUB_REF_NAME#app-v}"
          ARCH="$(uname -m)"
          FILE_NAME="$(dart modules/app/tool/release_asset_name.dart "${VERSION}" "${{ matrix.platform.slug }}" "${ARCH}" tar.gz)"
          STAGE_ROOT="${GITHUB_WORKSPACE}/.artifacts/linux-tar-stage/fund-monitor-app"
          rm -rf "${GITHUB_WORKSPACE}/.artifacts/linux-tar-stage"
          mkdir -p "${STAGE_ROOT}"
          cp -R modules/app/build/linux/x64/release/bundle/. "${STAGE_ROOT}/"
          tar -C "${GITHUB_WORKSPACE}/.artifacts/linux-tar-stage" -czf \
            "${GITHUB_WORKSPACE}/.artifacts/release-assets/${FILE_NAME}" \
            "fund-monitor-app"

      - name: Package Linux DEB release asset
        if: matrix.platform.target == 'linux'
        run: |
          VERSION="${GITHUB_REF_NAME#app-v}"
          DEB_VERSION="${VERSION/-/~}"
          ARCH="$(uname -m)"
          FILE_NAME="$(dart modules/app/tool/release_asset_name.dart "${VERSION}" "${{ matrix.platform.slug }}" "${ARCH}" deb)"
          PACKAGE_ARCH="$(dart modules/app/tool/release_deb_arch.dart "${ARCH}")"
          DEB_ROOT="${GITHUB_WORKSPACE}/.artifacts/linux-deb-root"
          rm -rf "${DEB_ROOT}"
          mkdir -p \
            "${DEB_ROOT}/DEBIAN" \
            "${DEB_ROOT}/opt/fund-monitor-app" \
            "${DEB_ROOT}/usr/bin" \
            "${DEB_ROOT}/usr/share/applications" \
            "${DEB_ROOT}/usr/share/icons/hicolor/256x256/apps"
          cp -R modules/app/build/linux/x64/release/bundle/. "${DEB_ROOT}/opt/fund-monitor-app/"
          cp modules/app/brand/logo/fund-monitor-mark.png \
            "${DEB_ROOT}/usr/share/icons/hicolor/256x256/apps/fund-monitor-app.png"
          cat > "${DEB_ROOT}/DEBIAN/control" <<EOF
          Package: fund-monitor-app
          Version: ${DEB_VERSION}
          Section: utils
          Priority: optional
          Architecture: ${PACKAGE_ARCH}
          Maintainer: Fund Monitor Team <noreply@github.com>
          Description: Fund monitor desktop app built with Flutter.
          EOF
          cat > "${DEB_ROOT}/usr/bin/fund-monitor-app" <<'EOF'
          #!/usr/bin/env sh
          exec /opt/fund-monitor-app/fund_monitor_app "$@"
          EOF
          chmod 0755 "${DEB_ROOT}/usr/bin/fund-monitor-app"
          cat > "${DEB_ROOT}/usr/share/applications/fund-monitor-app.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Fund Monitor App
          Comment=Professional fund monitor desktop terminal
          Exec=/opt/fund-monitor-app/fund_monitor_app
          Icon=fund-monitor-app
          Terminal=false
          Categories=Office;Finance;
          EOF
          dpkg-deb --build --root-owner-group "${DEB_ROOT}" \
            "${GITHUB_WORKSPACE}/.artifacts/release-assets/${FILE_NAME}"

      - name: Package macOS ZIP release asset
        if: matrix.platform.target == 'macos'
        run: |
          VERSION="${GITHUB_REF_NAME#app-v}"
          ARCH="$(uname -m)"
          FILE_NAME="$(dart modules/app/tool/release_asset_name.dart "${VERSION}" "${{ matrix.platform.slug }}" "${ARCH}" zip)"
          mkdir -p .artifacts/release-assets
          ditto -c -k --sequesterRsrc --keepParent \
            modules/app/build/macos/Build/Products/Release/fund_monitor_app.app \
            ".artifacts/release-assets/${FILE_NAME}"

      - name: Package macOS DMG release asset
        if: matrix.platform.target == 'macos'
        run: |
          VERSION="${GITHUB_REF_NAME#app-v}"
          ARCH="$(uname -m)"
          FILE_NAME="$(dart modules/app/tool/release_asset_name.dart "${VERSION}" "${{ matrix.platform.slug }}" "${ARCH}" dmg)"
          STAGE_ROOT="${GITHUB_WORKSPACE}/.artifacts/macos-dmg-stage"
          APP_STAGE="${STAGE_ROOT}/Fund Monitor App"
          rm -rf "${STAGE_ROOT}"
          mkdir -p "${APP_STAGE}"
          cp -R modules/app/build/macos/Build/Products/Release/fund_monitor_app.app "${APP_STAGE}/"
          ln -s /Applications "${APP_STAGE}/Applications"
          hdiutil create -volname "Fund Monitor App" \
            -srcfolder "${APP_STAGE}" \
            -ov -format UDZO \
            "${GITHUB_WORKSPACE}/.artifacts/release-assets/${FILE_NAME}"

      - name: Package Windows ZIP release asset
        if: matrix.platform.target == 'windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^app-v', ''
          $arch = $env:RUNNER_ARCH.ToLower()
          $fileName = (dart modules/app/tool/release_asset_name.dart $version '${{ matrix.platform.slug }}' $arch zip).Trim()
          New-Item -ItemType Directory -Force .artifacts/release-assets | Out-Null
          Compress-Archive `
            -Path modules/app/build/windows/x64/runner/Release/* `
            -DestinationPath ".artifacts/release-assets/$fileName"

      - name: Upload packaged assets
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.platform.artifact_name }}
          path: .artifacts/release-assets/*
          if-no-files-found: error

  publish:
    name: Publish app release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Download packaged assets
        uses: actions/download-artifact@v8
        with:
          path: .artifacts/release-assets
          pattern: app-*-assets
          merge-multiple: true

      - name: Generate release notes
        run: |
          dart modules/app/tool/generate_release_notes.dart \
            "${RELEASE_TAG}" \
            "${GITHUB_REPOSITORY}" \
            ".artifacts/release-assets" \
            ".artifacts/release-notes.md"
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "${RELEASE_TAG}" =~ ^app-v[0-9]+\.[0-9]+\.[0-9]+-.+ ]]; then
            PRERELEASE_FLAG="--prerelease"
          else
            PRERELEASE_FLAG=""
          fi

          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            mapfile -t EXISTING_ASSETS < <(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name')

            for ASSET_NAME in "${EXISTING_ASSETS[@]}"; do
              gh release delete-asset "${RELEASE_TAG}" "${ASSET_NAME}" --repo "${GITHUB_REPOSITORY}" --yes
            done

            gh release upload "${RELEASE_TAG}" .artifacts/release-assets/* --repo "${GITHUB_REPOSITORY}" --clobber
            gh release edit "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Fund Monitor App ${RELEASE_TAG}" \
              --notes-file .artifacts/release-notes.md \
              ${PRERELEASE_FLAG}
          else
            gh release create "${RELEASE_TAG}" .artifacts/release-assets/* \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Fund Monitor App ${RELEASE_TAG}" \
              --notes-file .artifacts/release-notes.md \
              ${PRERELEASE_FLAG}
          fi
