<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f7fb" />
    <title>{{ title }} - 基金监控</title>
    <link rel="stylesheet" href="/assets/app.css" />
  </head>
  <body>
    <div class="page-aura page-aura-left"></div>
    <div class="page-aura page-aura-right"></div>
    <div class="shell">
      <aside class="shell-nav">
        <div class="nav-brand-block">
          <a class="brand" href="/dashboard">
            <span class="brand-mark">FM</span>
            <span class="brand-copy">
              <strong>基金监控</strong>
              <small>Quant Monitor Workspace</small>
            </span>
          </a>
        </div>

        <nav class="nav-links" aria-label="主导航">
          <a class="nav-link {% if nav_key == "dashboard" %}active{% endif %}" href="/dashboard">
            <span>总览看板</span>
            <small>Dashboard</small>
          </a>
          <a class="nav-link {% if nav_key == "funds" %}active{% endif %}" href="/funds">
            <span>基金列表</span>
            <small>Funds</small>
          </a>
          <a class="nav-link {% if nav_key == "rules" %}active{% endif %}" href="/rules">
            <span>规则管理</span>
            <small>Rules</small>
          </a>
          <a class="nav-link {% if nav_key == "alerts" %}active{% endif %}" href="/alerts">
            <span>告警列表</span>
            <small>Alerts</small>
          </a>
          <a class="nav-link {% if nav_key == "settings" %}active{% endif %}" href="/settings">
            <span>系统配置</span>
            <small>Settings</small>
          </a>
        </nav>

      </aside>

      <div class="shell-body">
        <header class="shell-topbar">
          <div class="topbar-copy">
            <span class="topbar-label">fund monitor workspace</span>
            <strong>{{ title }}</strong>
          </div>
        </header>

        <main class="shell-main">
          {% block content %}{% endblock %}
        </main>
      </div>
    </div>

    <script src="/assets/app.js"></script>
  </body>
</html>
