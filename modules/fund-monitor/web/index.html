<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>基金监控</title>
    <link rel="stylesheet" href="/assets/app.css" />
  </head>
  <body>
    <main class="app">
      <section class="hero">
        <p class="eyebrow">fund-monitor</p>
        <h1>基金监控</h1>
        <p class="summary">
          使用 Rust + axum 构建，页面与静态资源默认可打包进单个 Rust 二进制。
        </p>
      </section>

      <section class="card-list">
        <article class="card">
          <h2>当前模块定位</h2>
          <ul>
            <li>基金列表管理</li>
            <li>监控规则定义</li>
            <li>轮询与告警入口</li>
            <li>监控结果展示</li>
          </ul>
        </article>

        <article class="card">
          <h2>当前技术栈</h2>
          <ul>
            <li>Rust</li>
            <li>axum</li>
            <li>html + css + js</li>
            <li>rust-embed</li>
          </ul>
        </article>
      </section>
    </main>

    <script src="/assets/app.js"></script>
  </body>
</html>
