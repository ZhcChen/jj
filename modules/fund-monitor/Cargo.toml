[package]
name = "fund-monitor"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
dotenvy = "0.15.7"
regex = "1.12.2"
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls", "charset", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "sqlite", "time", "macros", "migrate"] }
time = "0.3.44"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "net", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }

[dev-dependencies]
axum = "0.8.4"
tempfile = "3.20.0"
