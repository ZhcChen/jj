[package]
name = "fund-monitor"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
askama = "0.14.0"
axum = "0.8.4"
dotenvy = "0.15.7"
regex = "1.12.2"
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls", "charset"] }
rust-embed = "8.7.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "sqlite", "time", "macros", "migrate"] }
time = "0.3.44"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "net", "time"] }

[dev-dependencies]
http-body-util = "0.1.4"
tempfile = "3.20.0"
tower = { version = "0.5.2", features = ["util"] }
