[package]
name = "fund-monitor"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
axum = "0.8.4"
dotenvy = "0.15.7"
rust-embed = "8.7.2"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "sqlite", "time", "macros", "migrate"] }
time = "0.3.44"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "net"] }

[dev-dependencies]
tempfile = "3.20.0"
